[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-service"
version = "1.0.0"
description = "Document Intelligence & Question Extraction Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead Backend Engineer" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pymupdf>=1.23.26",
    "pypdf>=4.1.0",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0.80",
    "pytesseract>=0.3.10",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "filetype>=1.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.1",
    "openai>=1.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
