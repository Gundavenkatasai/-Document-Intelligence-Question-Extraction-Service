services:
  - type: web
    name: questionmind-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: questionmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: questionmind-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: /app/data/storage
      - key: AI_PROVIDER
        value: rule_based
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
      - key: CONFIDENCE_REVIEW_THRESHOLD
        value: "0.75"
      - key: MIN_CHARS_FOR_NATIVE_TEXT
        value: "40"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
    healthCheckPath: /health

databases:
  - name: questionmind-db
    plan: free
    databaseName: questionmind
    user: questionmind

  - type: redis
    name: questionmind-redis
    plan: free
