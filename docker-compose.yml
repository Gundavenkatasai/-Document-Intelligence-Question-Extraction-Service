services:
  postgres:
    image: postgres:16-alpine
    container_name: doc_intelligence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doc_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doc_intelligence_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_intelligence_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/doc_intelligence
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/data/storage
      SECRET_KEY: dev-production-secret-key-change-in-env-minimum-32-chars
      AI_PROVIDER: mock
    volumes:
      - doc_storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_intelligence_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/doc_intelligence
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/data/storage
      SECRET_KEY: dev-production-secret-key-change-in-env-minimum-32-chars
      AI_PROVIDER: mock
    volumes:
      - doc_storage:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  doc_storage:
